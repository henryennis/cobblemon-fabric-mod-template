# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true
# Loom run configs and IntelliJ still disagree on the configuration cache (fabric-loom#1349).
# Turn it on per invocation with --configuration-cache when running from the command line.
org.gradle.configuration-cache=false

# Mod identity. Everything else reads from here; dependency versions live in gradle/libs.versions.toml.
mod_id=examplemod
mod_name=Example Mod
mod_version=0.1.0
maven_group=com.example
mod_author=Your Name
mod_description=A Cobblemon side-mod built from the Fabric template.
mod_license=MIT
github_repo=your-github/examplemod

# Publishing targets. Leave blank to skip a destination. Tokens come from environment variables, see docs/releasing.md.
modrinth_project_id=
curseforge_project_id=
curseforge_project_slug=
