name: Build

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Format check, unit tests and jar
        run: ./gradlew build

      - name: Game tests on a dedicated server with Cobblemon loaded
        run: ./gradlew runGametest

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-output
          path: |
            build/libs/*.jar
            build/test-results/**/*.xml
          if-no-files-found: ignore
